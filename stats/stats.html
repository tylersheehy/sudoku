<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<script src="../shared/theme.js"></script>
<title>Sudoku for Fun: Statistics</title>
<link rel="stylesheet" href="../shared/theme.css">
<link rel="stylesheet" href="stats.css">
</head>
<body>
<main class="spage">
  <header class="shead">
    <a class="home-btn" href="../home/home.html" title="Home" aria-label="Home"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg></a>
    <h1>Statistics</h1>
    <button type="button" class="theme-btn" title="Switch theme">
      <svg class="to-dark" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="to-light" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <span class="vh to-dark">Switch to dark theme</span>
      <span class="vh to-light">Switch to paper theme</span>
    </button>
  </header>

  <div class="chips levels" id="levelPick" role="group" aria-label="Difficulty"></div>

  <section aria-labelledby="viewTitle">
    <h2 id="viewTitle"></h2>
    <div class="tiles" id="tiles"></div>
    <p class="note" id="note" hidden>Games started before statistics were added weren't counted, so early win rates may read a little high.</p>
  </section>

  <section class="summary" id="summary" aria-labelledby="summaryTitle">
    <h2 id="summaryTitle">By difficulty</h2>
    <div class="table-wrap">
      <table class="by-level">
        <thead><tr>
          <th scope="col">Level</th><th scope="col">Started</th><th scope="col">Won</th><th scope="col">Win rate</th>
          <th scope="col">No mistakes</th><th scope="col">Best score</th><th scope="col">Fastest</th><th scope="col">Average</th>
        </tr></thead>
        <tbody id="levelRows"></tbody>
      </table>
    </div>
  </section>
</main>
<script src="../shared/save-data.js"></script>
<script src="../shared/puzzle-maker.js"></script>
<script src="../shared/scores.js"></script>
<script src="stats.js"></script>
</body>
</html>
