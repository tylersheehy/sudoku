<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<script src="../shared/theme.js"></script>
<title>Sudoku: Learn techniques</title>
<link rel="stylesheet" href="../shared/theme.css">
<link rel="stylesheet" href="learn.css">
</head>
<body>
<main class="lpage">
  <header class="lhead">
    <div>
      <h1>Learn techniques</h1>
      <p class="sub" id="progress">&nbsp;</p>
    </div>
    <div class="lhead-actions">
      <button type="button" class="theme-btn" title="Switch theme">
        <svg class="to-dark" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="to-light" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <span class="vh to-dark">Switch to dark theme</span>
        <span class="vh to-light">Switch to paper theme</span>
      </button>
      <a class="btn" href="../home/home.html">Home</a>
      <a class="btn" href="../game/game.html">Back to the game</a>
    </div>
  </header>

  <div class="lshell">
    <nav class="path" aria-label="Lessons" id="path"></nav>

    <article class="lesson" id="lesson" aria-live="polite">
      <div class="ltop">
        <p class="meta" id="lmeta"></p>
        <h2 id="ltitle"></h2>
        <p id="lwhat"></p>
        <p class="look"><b>Where to look.</b> <span id="llook"></span></p>
      </div>

      <div class="modes" id="modes" role="tablist" aria-label="Lesson mode">
        <button type="button" role="tab" id="tabExample" data-mode="example">Worked example</button>
        <button type="button" role="tab" id="tabTry" data-mode="try">Try it yourself</button>
      </div>

      <div class="stage">
        <div class="lbwrap"><div class="lb" id="lb" role="grid" aria-label="Candidate grid"></div></div>

        <div class="side">
          <div class="steps" id="steps" role="group" aria-label="Example steps">
            <button type="button" class="play" id="playBtn">▶ Play</button>
            <button type="button" data-stage="1">1. Spot the pattern</button>
            <button type="button" data-stage="2">2. Apply it</button>
          </div>
          <div class="terms" id="terms" role="group" aria-label="Sudoku words" hidden></div>
          <div class="try" id="tryBox" hidden>
            <p id="prompt"></p>
            <div class="try-actions">
              <button type="button" class="btn primary" id="checkBtn">Check</button>
              <button type="button" class="btn" id="clearBtn">Clear</button>
              <button type="button" class="btn" id="showBtn">Show the pattern</button>
            </div>
          </div>
          <p class="explain" id="explain" role="status"></p>
          <div class="legend" id="legend" aria-label="Legend"></div>
        </div>
      </div>

      <div class="lnav">
        <a class="btn primary" id="practice" href="../game/game.html">Practice puzzle</a>
        <button type="button" class="btn" id="newEx">New example</button>
        <button type="button" class="btn" id="prev">Previous lesson</button>
        <button type="button" class="btn" id="next">Next lesson</button>
      </div>
    </article>
  </div>
</main>
<script src="../shared/save-data.js"></script>
<script src="../shared/solver-basics.js"></script>
<script src="../shared/solver-techniques.js"></script>
<script src="../shared/puzzle-maker.js"></script>
<script src="lessons-data.js"></script>
<script src="lesson-list.js"></script>
<script src="lesson-explain.js"></script>
<script src="lesson-terms.js"></script>
<script src="lesson-examples.js"></script>
<script src="learn.js"></script>
</body>
</html>
